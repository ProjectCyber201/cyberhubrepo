<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberSec Terminal sign-in</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b14;color:#e8f1ff;font-family:system-ui,sans-serif}
.c{max-width:420px;margin:24px;padding:28px;border:1px solid #1f3a5f;border-radius:14px;background:#0d1626;text-align:center}
h1{font-size:22px;margin:0 0 12px}p{color:#9fb3cf;line-height:1.5;margin:8px 0}.ok{color:#5ef2a0}.bad{color:#ff6b7a}
</style></head><body><div class="c"><h1 id="t">Finishing sign-in...</h1><p id="m">One moment.</p></div>
<script>
// Public values (same as in cloud.gd). Never put the secret key here.
const SB_URL="https://adztfpqfvhqugawnbqrr.supabase.co",SB_KEY="sb_publishable_sFary2kfnCFtbPDZahUi3w_lRYum6aG";
(async()=>{
  const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,""));
  const get=k=>q.get(k)||h.get(k)||"";
  const state=get("s"),code=get("code"),err=get("error_description")||get("error");
  const show=(t,m,c)=>{document.getElementById("t").textContent=t;document.getElementById("t").className=c;document.getElementById("m").textContent=m};
  if(!/^[a-f0-9]{32}$/.test(state)){show("Link not valid","Open the app and press Continue with Google again.","bad");return}
  if(!code&&!err){show("Nothing to send","Open the app and press Continue with Google again.","bad");return}
  try{
    const r=await fetch(SB_URL+"/rest/v1/rpc/auth_relay_put",{method:"POST",
      headers:{apikey:SB_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({p_state:state,p_code:code,p_error:code?"":err})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    if(code)show("Signed in","Go back to the CyberSec Terminal app. You can close this tab.","ok");
    else show("Sign-in was refused","Use your school Google account (@fatima.edu.ph or @student.fatima.edu.ph). Go back to the app and try again.","bad");
  }catch(e){show("Could not finish","Check your internet, then go back to the app and try again.","bad")}
})();
</script></body></html>
